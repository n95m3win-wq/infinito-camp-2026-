name: Generate sitemap

on:
  push:
    branches: [main]

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build sitemap.txt
        run: |
          DOMAIN="https://orbita.co.th"
          > sitemap.txt

          find . -name "*.html" \
            ! -path "./jsonld-snippet.html" \
            ! -name "index_9.html" \
            ! -path "./node_modules/*" \
            | sed 's|^\.||; s|/index\.html$|/|' \
            | sort | uniq \
            | while read path; do
                echo "${DOMAIN}${path}" >> sitemap.txt
              done

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.txt
          git diff --cached --quiet || git commit -m "Update sitemap.txt"
          git push

